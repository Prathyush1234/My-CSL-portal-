    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Suppress and intercept Vite HMR WebSocket connection closures in Cloud Run iframe environment
      (function() {
        try {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite')))
              ) {
                const dummy = new EventTarget();
                dummy.binaryType = 'blob';
                dummy.readyState = 1; // OPEN
                dummy.send = function() {};
                dummy.close = function() {};
                dummy.addEventListener = dummy.addEventListener.bind(dummy);
                dummy.removeEventListener = dummy.removeEventListener.bind(dummy);
                dummy.dispatchEvent = dummy.dispatchEvent.bind(dummy);
                setTimeout(function() {
                  try {
                    dummy.dispatchEvent(new Event('open'));
                  } catch (e) {}
                }, 5);
                return dummy;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          // Filter console.error from reporting disabled HMR websocket closures
          const origConsoleError = console.error;
          console.error = function() {
            for (let i = 0; i < arguments.length; i++) {
              const arg = arguments[i];
              const str = arg instanceof Error ? (arg.message + ' ' + (arg.stack || '')) : String(arg);
              if (str.indexOf('WebSocket closed without opened') !== -1 || (str.indexOf('[vite]') !== -1 && str.indexOf('WebSocket') !== -1)) {
                return;
              }
            }
            return origConsoleError.apply(console, arguments);
          };

          window.addEventListener('error', function(e) {
            if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ws://') !== -1 || e.message.indexOf('wss://') !== -1)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
        } catch (err) {}
      })();
    </script>
